<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TERRA-CORP OS</title>
  <link rel="stylesheet" href="style.css?v=40">
</head>
<body>
  <div id="monitor-frame">
    <!-- 인트로 출근 화면 -->
    <div id="intro-screen">
      <div class="intro-box">
        <div class="intro-logo">TERRA-CORP OS</div>
        <div class="intro-sub">원격 행성 개조 관제 단말기 v2.7</div>
        <div class="intro-desc">
          [근무 수칙]<br>
          1. 배정된 행성의 지구 유사율 93% 이상 달성<br>
          2. 과잉 수치(오버슈팅) 주의 및 유지비 통제<br>
          3. 납기일 초과 및 예산 파산 시 즉시 해고<br>
          * 모든 근무 기록은 단말기에 자동 저장됩니다.
        </div>
        <button id="start-work-btn" onclick="startWork()">[출근 도장 찍기 ▶]</button>
        <button id="reset-save-btn" class="hidden" onclick="resetSaveData()">[초기화 후 신입으로 재입사]</button>
      </div>
    </div>

    <!-- 상단 바 -->
    <header id="top-bar">
      <div class="top-row">
        <div>
          <span id="rank-badge">인턴</span>
          <strong id="planet-name">P-01 아레스-미니</strong>
        </div>
        <span id="day-counter">1일차 (마감 35일)</span>
      </div>
      <div class="top-row">
        <div>
          <span>예산: <strong id="budget-val">420</strong>Cr</span>
          <span class="sub-text">(<span id="net-income">+65</span>)</span>
        </div>
        <div class="top-btns">
          <button id="mail-btn" onclick="openMail()">✉메일<span id="mail-dot">!</span></button>
          <button id="next-day-btn" onclick="nextDay()">퇴근▶</button>
        </div>
      </div>
    </header>

    <!-- 중단: 행성 뷰포트 -->
    <main id="viewport-section">
      <div id="esi-overlay">
        유사율 <strong id="esi-val">12.0</strong>% <span class="sub-text">(목표 93%)</span>
        <div id="shield-status" class="sub-text">방어율: 0%</div>
      </div>
      <canvas id="planet-canvas" width="220" height="220"></canvas>
      <button id="complete-btn" class="hidden" onclick="completeProject()">[프로젝트 완료 보고]</button>
    </main>

    <!-- 데이터 패널 -->
    <section id="data-panel">
      <div id="radar-box">
        <canvas id="radar-canvas" width="136" height="136"></canvas>
      </div>
      <div id="params-list">
        <div class="param-row"><span>온도</span><div class="bar-bg"><div id="bar-temp" class="bar-fill"></div></div><span id="val-temp">-35°C</span></div>
        <div class="param-row"><span>기압</span><div class="bar-bg"><div id="bar-press" class="bar-fill"></div></div><span id="val-press">20kPa</span></div>
        <div class="param-row"><span>수위</span><div class="bar-bg"><div id="bar-water" class="bar-fill"></div></div><span id="val-water">10%</span></div>
        <div class="param-row"><span>산소</span><div class="bar-bg"><div id="bar-o2" class="bar-fill"></div></div><span id="val-o2">2%</span></div>
        <div class="param-row"><span>생태</span><div class="bar-bg"><div id="bar-bio" class="bar-fill"></div></div><span id="val-bio">0%</span></div>
      </div>
    </section>

    <!-- 로그 창 -->
    <section id="log-panel">
      <div id="mail-header">[시스템 로그]</div>
      <div id="log-message">관제 시스템 준비 완료.</div>
    </section>

    <!-- 하단 설비 창 -->
    <footer id="control-panel">
      <div id="facility-list"></div>
    </footer>

    <!-- 메일함 팝업 -->
    <div id="mail-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-title">
          <span>[사내 인트라넷 메일함]</span>
          <button onclick="closeMail()">X</button>
        </div>
        <div id="mail-content"></div>
      </div>
    </div>
  </div>

  <script src="sound.js?v=40"></script>
  <script src="data.js?v=40"></script>
  <script src="render.js?v=40"></script>
  <script src="game.js?v=40"></script>
</body>
</html>
